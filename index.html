<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>futsal - laggenerator</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="images/logo-favicon.png" />
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <div class="container mt-4 mb-0 mb-md-4">
      <div class="logo text-center">
        <img src="images/logo.png" alt="futsal logo" width="400" />
      </div>
      <hr />
      <div class="row">
        <div class="col-12 col-md-4 px-3 pb-3">
          <h4 class="text-center text-md-start">Spelare</h4>
          <div class="card">
            <div class="card-body">
              <div id="player-list" class="row"></div>
            </div>
            <div class="text-center">
              <div class="form-check form-check-inline">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="select-all"
                />
                <label class="form-check-label" for="select-all"
                  >Välj alla</label
                >
              </div>
            </div>
          </div>
          <div class="d-flex justify-content-center gap-2 mt-4">
            <button id="clear-selection-button" class="btn btn-danger">
              Rensa
            </button>
            <button
              id="add-temp-player-button"
              type="button"
              class="btn btn-primary"
              data-bs-toggle="modal"
              data-bs-target="#temp-player-modal"
              title="Lägg till tillfällig spelare"
            >
              Lägg till spelare
            </button>
            <button id="generate-teams-button" class="btn btn-green">
              Skapa lag
            </button>
          </div>
        </div>
        <div id="team-section" class="col-12 col-md-4 px-3 pb-3">
          <h4 class="text-center text-md-start">Lagindelning</h4>
          <div id="team-list" class="row"></div>
        </div>
        <div
          id="picture-section"
          class="col-12 col-md-4 px-3 pb-3 d-none d-md-block"
        >
          <img
            src="images/jorgen-hendriksen-8yLDFM3P9Cs-unsplash.jpg"
            alt="Futsal hall"
            class="img-fluid"
          />
        </div>
      </div>
    </div>

    <footer class="app-footer text-center py-1">
      <div class="container">
        <p class="mb-0">
          edv1nn1lsson |
          <a
            href="https://github.com/edv1nn1lsson"
            target="_blank"
            rel="noopener noreferrer"
            >GitHub</a
          >
        </p>
      </div>
    </footer>

    <!-- Overlay för att lägga till tillfällig spelare -->
    <div
      class="modal fade"
      id="temp-player-modal"
      tabindex="-1"
      aria-labelledby="temp-player-modal-title"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <form id="temp-player-form" novalidate>
            <div class="modal-header">
              <h5 class="modal-title" id="temp-player-modal-title">
                Lägg till tillfällig spelare
              </h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Stäng"
              ></button>
            </div>
            <div class="modal-body">
              <div class="mb-3">
                <label for="temp-name" class="form-label">Namn</label>
                <input
                  type="text"
                  id="temp-name"
                  class="form-control"
                  maxlength="50"
                  autocomplete="off"
                />
              </div>
              <div class="mb-3">
                <label for="temp-skill" class="form-label">Skill (1–100)</label>
                <input
                  type="number"
                  id="temp-skill"
                  class="form-control"
                  min="1"
                  max="100"
                  inputmode="numeric"
                />
              </div>
              <div class="mb-2">
                <div class="form-label">Position</div>
                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="temp-position"
                    id="temp-position-defender"
                    value="DEFENDER"
                  />
                  <label class="form-check-label" for="temp-position-defender"
                    >Försvarare</label
                  >
                </div>
                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="temp-position"
                    id="temp-position-forward"
                    value="FORWARD"
                  />
                  <label class="form-check-label" for="temp-position-forward"
                    >Anfallare</label
                  >
                </div>
              </div>
              <div
                id="temp-player-error"
                class="text-danger small"
                role="alert"
              ></div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Avbryt
              </button>
              <button type="submit" class="btn btn-primary">Lägg till</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div id="overlay" class="overlay" style="display: none">
      <img id="loading-gif" alt="Loading..." />
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
